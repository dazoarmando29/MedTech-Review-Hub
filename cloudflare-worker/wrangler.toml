name = "medtech-review-hub-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Cloudflare Worker deployment of the MedTech Review Hub backend
# (same API contract as backend/ — see shared/api/API.md).
# Secrets (set with `wrangler secret put <NAME>`): JWT_SECRET, GEMINI_API_KEY

[vars]
GEMINI_MODEL = "gemini-3.5-flash"
AUTH_PBKDF2_ITERATIONS = "100000"
AI_DAILY_TOKEN_BUDGET = "20000"
AI_DAILY_TOKEN_BUDGET_ANON = "20000"
# Comma-separated allowed origins; "*" allows any origin (development).
ALLOWED_ORIGINS = "*"

[[d1_databases]]
binding = "DB"
database_name = "medtech-review-hub"
database_id = "a9127a5c-d2ef-4a20-b306-8e7c025c305a"

# Optional: object storage for user PDFs (requires R2 enabled on the account).
# Uncomment after `wrangler r2 bucket create medtech-review-hub-pdfs` and
# replacing the bucket_name.
# [[r2_buckets]]
# binding = "PDFS"
# bucket_name = "medtech-review-hub-pdfs"
