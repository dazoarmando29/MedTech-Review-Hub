name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-validate:
    name: Validate content JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 21
      - name: Parse every content JSON file
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            let files = [];
            (function walk(d){ for (const f of fs.readdirSync(d)) { const p = path.join(d,f);
              if (fs.statSync(p).isDirectory()) walk(p); else if (p.endsWith('.json')) files.push(p); } })('shared/content');
            let bad = 0;
            for (const f of files) { try { JSON.parse(fs.readFileSync(f,'utf8')); } catch(e) { bad++; console.error('FAIL', f, e.message); } }
            console.log('checked', files.length, 'files; failures:', bad);
            if (bad > 0 || files.length === 0) process.exit(1);
          "

  web:
    name: Web tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 21
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-static-export
          path: web/out
          retention-days: 7

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew
      - run: ./gradlew test --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  android:
    name: Android tests & debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew
      - run: ./gradlew :app:testDebugUnitTest --console=plain
      - run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
