ktor {
  deployment {
    port = 8080
    port = ${?PORT}
    host = "0.0.0.0"
    host = ${?HOST}
  }
}

database {
  url = "jdbc:postgresql://localhost:5432/medtech"
  url = ${?DATABASE_URL}
  user = "medtech"
  user = ${?DATABASE_USER}
  password = ""
  password = ${?DATABASE_PASSWORD}
}

jwt {
  secret = "dev-only-change-me"
  secret = ${?JWT_SECRET}
  issuer = "medtech-review-hub"
  issuer = ${?JWT_ISSUER}
}

ai {
  provider = "none"
  provider = ${?AI_PROVIDER}
  dailyTokenBudget = 20000
  dailyTokenBudget = ${?AI_DAILY_TOKEN_BUDGET}
}

content {
  dir = ""
  dir = ${?CONTENT_DIR}
}

cors {
  allowAll = true
  allowAll = ${?ALLOW_ALL_ORIGINS}
  allowedOrigins = ""
  allowedOrigins = ${?ALLOWED_ORIGINS}
}

media {
  root = "media"
  root = ${?MEDIA_ROOT}
}

uploads {
  maxBytes = 52428800
}

rateLimit {
  generalPerMinute = 100
  aiPerMinute = 20
}

adminEmails = ""
adminEmails = ${?ADMIN_EMAILS}
